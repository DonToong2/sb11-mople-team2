name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI PipeLine"]
    types: [completed]
    branches: [ "main" ]

concurrency:
  group: mople-production-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: mople-app
  CONTAINER_NAME: mople-app

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 및 ECR 푸시
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Task definition에 계정 ID 채우기
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          sed -i "s/ACCOUNT_ID_PLACEHOLDER/${AWS_ACCOUNT_ID}/g" task-definition.json

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Fill in env vars
        id: fill-env
        env:
          DB_URL: ${{ secrets.DB_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          DOMAIN_HOST: ${{ secrets.DOMAIN_HOST }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          SSE_SERVER_ID: ${{ secrets.SSE_SERVER_ID }}
          KAFKA_ENABLED: ${{ secrets.KAFKA_ENABLED }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          ELASTICSEARCH_URI: ${{ secrets.ELASTICSEARCH_URI }}
          ELASTICSEARCH_PORT: ${{ secrets.ELASTICSEARCH_PORT }}
          ELASTICSEARCH_SECURITY_ENABLED: ${{ secrets.ELASTICSEARCH_SECURITY_ENABLED }}
          ELASTICSEARCH_SSL_ENABLED: ${{ secrets.ELASTICSEARCH_SSL_ENABLED }}
          ELASTICSEARCH_CA_PATH: ${{ secrets.ELASTICSEARCH_CA_PATH }}
          TMDB_COLLECT_ENABLED: ${{ secrets.TMDB_COLLECT_ENABLED }}
        run: |
          jq \
            --arg CONTAINER_NAME "$CONTAINER_NAME" \
            --arg DB_URL "$DB_URL" \
            --arg REDIS_HOST "$REDIS_HOST" \
            --arg REDIS_PORT "$REDIS_PORT" \
            --arg DOMAIN_HOST "$DOMAIN_HOST" \
            --arg FRONTEND_ORIGIN "$FRONTEND_ORIGIN" \
            --arg CORS_ALLOWED_ORIGIN "$CORS_ALLOWED_ORIGIN" \
            --arg COOKIE_SECURE "$COOKIE_SECURE" \
            --arg SSE_SERVER_ID "$SSE_SERVER_ID" \
            --arg KAFKA_ENABLED "$KAFKA_ENABLED" \
            --arg KAFKA_BOOTSTRAP_SERVERS "$KAFKA_BOOTSTRAP_SERVERS" \
            --arg ELASTICSEARCH_URI "$ELASTICSEARCH_URI" \
            --arg ELASTICSEARCH_PORT "$ELASTICSEARCH_PORT" \
            --arg ELASTICSEARCH_SECURITY_ENABLED "$ELASTICSEARCH_SECURITY_ENABLED" \
            --arg ELASTICSEARCH_SSL_ENABLED "$ELASTICSEARCH_SSL_ENABLED" \
            --arg ELASTICSEARCH_CA_PATH "$ELASTICSEARCH_CA_PATH" \
            --arg TMDB_COLLECT_ENABLED "$TMDB_COLLECT_ENABLED" \
            '(.containerDefinitions[] | select(.name == $CONTAINER_NAME) | .environment) =
              [
                {name:"DB_URL", value:$DB_URL},
                {name:"REDIS_HOST", value:$REDIS_HOST},
                {name:"REDIS_PORT", value:$REDIS_PORT},
                {name:"DOMAIN_HOST", value:$DOMAIN_HOST},
                {name:"FRONTEND_ORIGIN", value:$FRONTEND_ORIGIN},
                {name:"CORS_ALLOWED_ORIGIN", value:$CORS_ALLOWED_ORIGIN},
                {name:"COOKIE_SECURE", value:$COOKIE_SECURE},
                {name:"SSE_SERVER_ID", value:$SSE_SERVER_ID},
                {name:"KAFKA_ENABLED", value:$KAFKA_ENABLED},
                {name:"KAFKA_BOOTSTRAP_SERVERS", value:$KAFKA_BOOTSTRAP_SERVERS},
                {name:"ELASTICSEARCH_URI", value:$ELASTICSEARCH_URI},
                {name:"ELASTICSEARCH_PORT", value:$ELASTICSEARCH_PORT},
                {name:"ELASTICSEARCH_SECURITY_ENABLED", value:$ELASTICSEARCH_SECURITY_ENABLED},
                {name:"ELASTICSEARCH_SSL_ENABLED", value:$ELASTICSEARCH_SSL_ENABLED},
                {name:"ELASTICSEARCH_CA_PATH", value:$ELASTICSEARCH_CA_PATH},
                {name:"TMDB_COLLECT_ENABLED", value:$TMDB_COLLECT_ENABLED}
              ]' \
            "${{ steps.render.outputs.task-definition }}" > filled-task-def.json
          echo "task-definition=filled-task-def.json" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.fill-env.outputs.task-definition }}
          service: mople-app-service
          cluster: mople-cluster
          wait-for-service-stability: true