name: Promote develop to main

on:
  workflow_run:
    workflows: ["CI PipeLine"]
    types: [completed]
    branches: [ "develop" ]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TO_MAIN_PAT }}

      - name: main을 develop으롤 fast-forward
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$HEAD_SHA"
          git merge --ff-only "$HEAD_SHA"
          git push origin main
