spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    enabled: ${KAFKA_ENABLED:false}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}

logging:
  level:
    com.codeit.mople: INFO

jwt:
  secret: ${JWT_SECRET}

password-reset:
  enabled: true
  rate-limit:
    global:
      max-requests: 200
      window-minutes: 1440

external-api:
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: ${TMDB_API_KEY}
  sportsdb:
    base-url: https://www.thesportsdb.com/api/v1/json
    api-key: ${SPORTSDB_API_KEY}

batch:
  tmdb:
    collect:
      cron: "0 0 3 * * *"
      enabled: ${TMDB_COLLECT_ENABLED:false}

sse:
  server-id: ${SSE_SERVER_ID}